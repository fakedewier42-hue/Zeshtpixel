name: Minecraft Server with ZBProxy & playit.gg (Auto)

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget curl screen

    - name: Download ZBProxy
      run: |
        wget -q -O ZBProxy "https://github.com/layou233/ZBProxy/releases/download/v3.1.0/ZBProxy-linux-amd64-v1"
        chmod +x ZBProxy

    - name: Create ZBProxy Configuration
      run: |
        cat > ZBProxy.json << 'EOF'
        {
            "Log": {
                "Level": "info"
            },
            "Services": [
                {
                    "Name": "Hypixel-in",
                    "Listen": 25565,
                    "IPAccess": {
                        "Mode": ""
                    },
                    "Outbound": {}
                }
            ],
            "Router": {
                "DefaultOutbound": "RESET",
                "Rules": [
                    {
                        "Type": "always",
                        "Rewrite": {},
                        "Sniff": "minecraft"
                    },
                    {
                        "Type": "ServiceName",
                        "Parameter": "Hypixel-in",
                        "Rewrite": {
                            "Minecraft": {
                                "Hostname": "mc.hypixel.net",
                                "Port": 25565
                            }
                        },
                        "Outbound": "Hypixel-out"
                    }
                ]
            },
            "Outbounds": [
                {
                    "Name": "Hypixel-out",
                    "TargetAddress": "mc.hypixel.net",
                    "TargetPort": 25565,
                    "Minecraft": {
                        "OnlineCount": {
                            "Max": 20,
                            "Online": -1,
                            "EnableMaxLimit": false
                        },
                        "HostnameAccess": {
                            "Mode": ""
                        },
                        "NameAccess": {
                            "Mode": ""
                        },
                        "PingMode": "",
                        "MotdFavicon": "{DEFAULT_MOTD}",
                        "MotdDescription": "§6§lWelcome to §c§lZeshtPixel §e§lthe server by §b§lDabbler_"
                    },
                    "ProxyOptions": {}
                }
            ],
            "Lists": {}
        }
        EOF

    - name: Run ZBProxy in Screen
      run: |
        screen -dmS zbproxy ./ZBProxy
        sleep 5

    - name: Install playit.gg
      run: |
        curl -fsSL https://packages.playit.gg/install.sh | bash -s -- -y

    - name: Run playit.gg with Secret Key
      env:
        SECRET_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}
      run: |
        echo "==========================================="
        echo "🔐 Starting playit.gg with Secret Key..."
        echo "==========================================="
        
        # توقف سرویس سیستمی
        sudo systemctl stop playit.service || true
        sudo systemctl disable playit.service || true
        
        # اجرای playit با Secret Key در screen
        screen -dmS playit bash -c "playit -s $SECRET_KEY"
        sleep 5
        
        echo "✅ playit.gg is running with your Secret Key!"
        echo "==========================================="

    - name: Show Connection Info
      run: |
        echo "==========================================="
        echo "✅ Server is READY!"
        echo "==========================================="
        echo ""
        echo "🔗 The address will be available in the playit.gg dashboard:"
        echo "   https://playit.gg/"
        echo ""
        echo "📋 How to connect:"
        echo "   1. Go to playit.gg dashboard"
        echo "   2. Find the tunnel address for your server"
        echo "   3. Share the address with your friends"
        echo "🎮 Connect to the server using that address"
        echo "==========================================="

    - name: Keep Alive
      run: |
        echo "🔄 Server is running for 6 hours..."
        for i in {1..360}; do
          sleep 60
          if [ $((i % 5)) -eq 0 ]; then
            echo "⏱️ Still alive... $(date)"
            if ! pgrep -f "./ZBProxy" > /dev/null; then
              echo "⚠️ ZBProxy died! Restarting..."
              screen -dmS zbproxy ./ZBProxy
            fi
            if ! pgrep -f "playit" > /dev/null; then
              echo "⚠️ playit.gg died! Restarting..."
              screen -dmS playit bash -c "playit -s ${{ secrets.PLAYIT_SECRET_KEY }}"
            fi
          fi
        done
