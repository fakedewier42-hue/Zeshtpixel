name: Minecraft Server (Windows) with playit.gg

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download ZBProxy (Windows)
      run: |
        Write-Host "📥 Downloading ZBProxy v3.1.0 for Windows..."
        $url = "https://github.com/layou233/ZBProxy/releases/download/v3.1.0/ZBProxy-windows-amd64-v3.exe"
        curl -L -o ZBProxy.exe $url
        if (Test-Path ZBProxy.exe) {
          Write-Host "✅ Download successful! File size: $((Get-Item ZBProxy.exe).Length) bytes"
        } else {
          Write-Host "❌ Download failed!"
          exit 1
        }

    - name: Download and Encode Icon
      run: |
        curl -L -o server-icon.png "https://raw.githubusercontent.com/fakedewier42-hue/Zesht-Icon/main/photo_2026-09-01_15-14-07.png"
        $bytes = [System.IO.File]::ReadAllBytes("$pwd\server-icon.png")
        $base64 = [Convert]::ToBase64String($bytes)
        $ICON_BASE64 = "data:image/png;base64,$base64"
        echo "ICON_BASE64=$ICON_BASE64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Create ZBProxy Configuration
      run: |
        $ICON = $env:ICON_BASE64
        @"
        {
            "Log": {
                "Level": "info"
            },
            "Services": [
                {
                    "Name": "Hypixel-in",
                    "Listen": 25565,
                    "IPAccess": {
                        "Mode": ""
                    },
                    "Outbound": {}
                }
            ],
            "Router": {
                "DefaultOutbound": "RESET",
                "Rules": [
                    {
                        "Type": "always",
                        "Rewrite": {},
                        "Sniff": "minecraft"
                    },
                    {
                        "Type": "ServiceName",
                        "Parameter": "Hypixel-in",
                        "Rewrite": {
                            "Minecraft": {
                                "Hostname": "mc.hypixel.net",
                                "Port": 25565
                            }
                        },
                        "Outbound": "Hypixel-out"
                    }
                ]
            },
            "Outbounds": [
                {
                    "Name": "Hypixel-out",
                    "TargetAddress": "mc.hypixel.net",
                    "TargetPort": 25565,
                    "Minecraft": {
                        "OnlineCount": {
                            "Max": 20,
                            "Online": -1,
                            "EnableMaxLimit": false
                        },
                        "HostnameAccess": {
                            "Mode": ""
                        },
                        "NameAccess": {
                            "Mode": ""
                        },
                        "PingMode": "",
                        "MotdFavicon": "$ICON",
                        "MotdDescription": "§6§lWelcome to §c§lZeshtPixel §e§lthe server by §b§lDabbler_"
                    },
                    "ProxyOptions": {}
                }
            ],
            "Lists": {}
        }
        "@ | Out-File -FilePath ZBProxy.json -Encoding utf8

    - name: Run ZBProxy in Background
      run: |
        Write-Host "🚀 Starting ZBProxy..."
        Start-Job -ScriptBlock { & ".\ZBProxy.exe" > zbproxy.log 2>&1 }
        Start-Sleep -Seconds 5
        Write-Host "✅ ZBProxy is running as a job!"

    - name: Install playit.gg (Windows)
      run: |
        Write-Host "📥 Downloading playit.gg MSI installer..."
        $url = "https://builds.playit.gg/1.0.10/playit-windows-x86_64-signed.msi"
        $installer = "playit-installer.msi"
        curl -L -o $installer $url
        
        if (-not (Test-Path $installer)) {
          Write-Host "❌ Download failed! File not found."
          exit 1
        }
        Write-Host "✅ Download successful! File size: $((Get-Item $installer).Length) bytes"
        
        Write-Host "📦 Installing playit.gg (silent)..."
        Start-Process -Wait -FilePath "msiexec" -ArgumentList "/i $installer /quiet /qn /norestart"
        Start-Sleep -Seconds 10
        Write-Host "✅ playit.gg installed!"

    - name: Show Connection Info
      run: |
        Write-Host "==========================================="
        Write-Host "✅ Server is READY on Windows!"
        Write-Host "==========================================="
        Write-Host ""
        Write-Host "🔗 To access the server:"
        Write-Host "   1. Connect via Remote Desktop (RDP) to this Windows machine"
        Write-Host "   2. Open playit.gg from the Start Menu or 'C:\Program Files\playit_gg\bin\playit.exe'"
        Write-Host "   3. Follow the instructions to get the Claim Code and create a tunnel"
        Write-Host "   4. Share the generated address with your friends"
        Write-Host ""
        Write-Host "📋 Note: ZBProxy is already running on port 25565"
        Write-Host "🎮 Connect to the playit.gg address from Minecraft"
        Write-Host "==========================================="

    - name: Keep Alive
      run: |
        Write-Host "🔄 Server is running for 6 hours..."
        for ($i = 1; $i -le 360; $i++) {
          Start-Sleep -Seconds 60
          if ($i % 5 -eq 0) {
            Write-Host "⏱️ Still alive... $(Get-Date)"
            $proc = Get-Job -Name "ZBProxy" -ErrorAction SilentlyContinue
            if (-not $proc -or $proc.State -eq "Completed" -or $proc.State -eq "Failed") {
              Write-Host "⚠️ ZBProxy died! Restarting..."
              Start-Job -ScriptBlock { & ".\ZBProxy.exe" > zbproxy.log 2>&1 }
            }
          }
        }
