name: OOpsy

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # =============================================
    # 1. نصب و راه‌اندازی Tailscale
    # =============================================
    - name: Install Tailscale
      run: |
        $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
        Write-Host "Downloading Tailscale from: $url"
        Invoke-WebRequest -Uri $url -OutFile tailscale-installer.exe -UseBasicParsing
        if (-not (Test-Path tailscale-installer.exe)) {
            throw "Download failed: tailscale-installer.exe not found"
        }
        Write-Host "Download successful, installing..."
        Start-Process -Wait -FilePath ".\tailscale-installer.exe" -ArgumentList "/quiet /qn /norestart"
        Start-Sleep -Seconds 15
        Write-Host "Installation complete."

    - name: Connect to Tailscale
      run: |
        & "C:\Program Files\Tailscale\tailscale.exe" up --authkey $env:TAILSCALE_AUTH_KEY --accept-routes --accept-dns
      env:
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Set User Password
      run: Set-LocalUser -Name "Sepehr" -Password (ConvertTo-SecureString -AsPlainText "Sepehr" -Force)

    # =============================================
    # 2. دانلود و نصب ZBProxy روی دسکتاپ
    # =============================================
    - name: Download ZBProxy
      run: |
        Write-Host "📥 Downloading ZBProxy v3.1.0 for Windows..."
        $url = "https://github.com/layou233/ZBProxy/releases/download/v3.1.0/ZBProxy-windows-amd64-v3.exe"
        Invoke-WebRequest -Uri $url -OutFile "$env:USERPROFILE\Desktop\ZBProxy.exe" -UseBasicParsing
        if (Test-Path "$env:USERPROFILE\Desktop\ZBProxy.exe") {
          Write-Host "✅ ZBProxy downloaded successfully on Desktop!"
        } else {
          Write-Host "❌ Download failed!"
          exit 1
        }

    # =============================================
    # 3. ایجاد کانفیگ ZBProxy روی دسکتاپ
    # =============================================
    - name: Create ZBProxy Configuration
      run: |
        @"
        {
            "Log": {
                "Level": "info"
            },
            "Services": [
                {
                    "Name": "Hypixel-in",
                    "Listen": 25565,
                    "IPAccess": {
                        "Mode": ""
                    },
                    "Outbound": {}
                }
            ],
            "Router": {
                "DefaultOutbound": "RESET",
                "Rules": [
                    {
                        "Type": "always",
                        "Rewrite": {},
                        "Sniff": "minecraft"
                    },
                    {
                        "Type": "ServiceName",
                        "Parameter": "Hypixel-in",
                        "Rewrite": {
                            "Minecraft": {
                                "Hostname": "mc.hypixel.net",
                                "Port": 25565
                            }
                        },
                        "Outbound": "Hypixel-out"
                    }
                ]
            },
            "Outbounds": [
                {
                    "Name": "Hypixel-out",
                    "TargetAddress": "mc.hypixel.net",
                    "TargetPort": 25565,
                    "Minecraft": {
                        "OnlineCount": {
                            "Max": 20,
                            "Online": -1,
                            "EnableMaxLimit": false
                        },
                        "HostnameAccess": {
                            "Mode": ""
                        },
                        "NameAccess": {
                            "Mode": ""
                        },
                        "PingMode": "",
                        "MotdDescription": "§6§lWelcome to §c§lZeshtPixel §e§lthe server by §b§lDabbler_"
                    },
                    "ProxyOptions": {}
                }
            ],
            "Lists": {}
        }
        "@ | Out-File -FilePath "$env:USERPROFILE\Desktop\ZBProxy.json" -Encoding utf8

    # =============================================
    # 4. نصب playit.gg روی دسکتاپ
    # =============================================
    - name: Install playit.gg
      run: |
        Write-Host "📥 Downloading playit.gg MSI installer..."
        $url = "https://builds.playit.gg/1.0.10/playit-windows-x86_64-signed.msi"
        $installer = "$env:USERPROFILE\Desktop\playit-installer.msi"
        Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
        
        if (-not (Test-Path $installer)) {
          Write-Host "❌ Download failed! File not found."
          exit 1
        }
        Write-Host "✅ Download successful! File size: $((Get-Item $installer).Length) bytes"
        
        Write-Host "📦 Installing playit.gg (silent)..."
        Start-Process -Wait -FilePath "msiexec" -ArgumentList "/i $installer /quiet /qn /norestart"
        Start-Sleep -Seconds 10
        Write-Host "✅ playit.gg installed!"

    # =============================================
    # 5. نمایش اطلاعات اتصال
    # =============================================
    - name: Display Connection Details
      run: |
        $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip
        Write-Host "================================="
        Write-Host "✅ RDP IS READY!"
        Write-Host "IP Address: $ip"
        Write-Host "Username  : runneradmin"
        Write-Host "Password  : WindowsRDP#2025"
        Write-Host "================================="
        Write-Host ""
        Write-Host "📋 ZBProxy and playit.gg are installed on Desktop:"
        Write-Host "   - ZBProxy.exe"
        Write-Host "   - ZBProxy.json"
        Write-Host "   - playit-installer.msi (installer file)"
        Write-Host ""
        Write-Host "🔗 To access the server:"
        Write-Host "   1. Connect via Remote Desktop to IP: $ip"
        Write-Host "   2. Run ZBProxy.exe from Desktop"
        Write-Host "   3. Run playit.gg from Start Menu or Desktop to create a tunnel"
        Write-Host "================================="

    # =============================================
    # 6. نگهداشتن سرور (6 ساعت)
    # =============================================
    - name: Keep Alive
      run: |
        Write-Host "🔄 Server is running for 6 hours..."
        for ($i = 0; $i -lt 360; $i++) {
          Start-Sleep -Seconds 60
          if ($i % 5 -eq 0) {
            Write-Host "⏱️ Still alive... $(Get-Date)"
          }
        }
