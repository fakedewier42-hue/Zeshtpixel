name: Minecraft Server with ZBProxy & playit.gg

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget curl screen

    - name: Download ZBProxy
      run: |
        wget -q -O ZBProxy "https://github.com/layou233/ZBProxy/releases/download/v3.1.0/ZBProxy-linux-amd64-v1"
        chmod +x ZBProxy

    - name: Create ZBProxy Configuration
      run: |
        cat > ZBProxy.json << 'EOF'
        {
            "Log": {
                "Level": "info"
            },
            "Services": [
                {
                    "Name": "Hypixel-in",
                    "Listen": 25565,
                    "IPAccess": {
                        "Mode": ""
                    },
                    "Outbound": {}
                }
            ],
            "Router": {
                "DefaultOutbound": "RESET",
                "Rules": [
                    {
                        "Type": "always",
                        "Rewrite": {},
                        "Sniff": "minecraft"
                    },
                    {
                        "Type": "ServiceName",
                        "Parameter": "Hypixel-in",
                        "Rewrite": {
                            "Minecraft": {
                                "Hostname": "mc.hypixel.net",
                                "Port": 25565
                            }
                        },
                        "Outbound": "Hypixel-out"
                    }
                ]
            },
            "Outbounds": [
                {
                    "Name": "Hypixel-out",
                    "TargetAddress": "mc.hypixel.net",
                    "TargetPort": 25565,
                    "Minecraft": {
                        "OnlineCount": {
                            "Max": 20,
                            "Online": -1,
                            "EnableMaxLimit": false
                        },
                        "HostnameAccess": {
                            "Mode": ""
                        },
                        "NameAccess": {
                            "Mode": ""
                        },
                        "PingMode": "",
                        "MotdFavicon": "{DEFAULT_MOTD}",
                        "MotdDescription": "§6§lWelcome to §c§lZeshtPixel §e§lthe server by §b§lDabbler_"
                    },
                    "ProxyOptions": {}
                }
            ],
            "Lists": {}
        }
        EOF

    - name: Run ZBProxy in Screen
      run: |
        screen -dmS zbproxy ./ZBProxy
        sleep 5

    - name: Install playit.gg (Manual Repo)
      run: |
        echo "==========================================="
        echo "📦 Installing playit.gg using manual repo..."
        echo "==========================================="
        
        # 1. دانلود و نصب کلید GPG
        curl -SsL https://packages.playit.gg/keys/playit.gpg | gpg --dearmor | sudo tee /usr/share/keyrings/playit.gpg >/dev/null
        sudo chmod 0644 /usr/share/keyrings/playit.gpg
        
        # 2. اضافه کردن ریپازیتوری
        sudo curl -fsSL -o /etc/apt/sources.list.d/playit.list https://packages.playit.gg/repo-files/playit-debian.list
        
        # 3. بروزرسانی و نصب
        sudo apt update
        sudo apt install -y playit
        
        echo "✅ playit.gg installed successfully!"

    - name: Run playit.gg and show Claim Code
      run: |
        echo "==========================================="
        echo "🔐 Starting playit.gg to get Claim Code..."
        echo "==========================================="
        
        # 1. اطمینان از عدم اجرای سرویس
        sudo systemctl stop playit.service || true
        
        # 2. حذف فایل‌های پیکربندی قدیمی (برای دریافت Claim Code جدید)
        sudo rm -rf /etc/playit || true
        rm -rf ~/.config/playit || true
        
        # 3. اجرای playit با timeout و نمایش خروجی مستقیم
        echo "🔄 Running playit directly (timeout 60 seconds)..."
        timeout 60s playit || true
        
        echo "==========================================="
        echo "🔍 Claim Code should appear above (if any)."
        echo "If you don't see it, check the logs above for errors."
        echo "==========================================="

    - name: Show Connection Info
      run: |
        echo "==========================================="
        echo "✅ Server is READY!"
        echo "==========================================="
        echo ""
        echo "📋 How to connect:"
        echo "   1. Find the Claim Code link above"
        echo "   2. Open it in your browser"
        echo "   3. Claim the device"
        echo "   4. Create a Minecraft Java tunnel on port 25565"
        echo "   5. Share the generated address with your friends"
        echo ""
        echo "🔗 The address will be something like: abc123.joinmc.link"
        echo "🎮 Connect to the server using this address"
        echo "==========================================="

    - name: Keep Alive
      run: |
        echo "🔄 Server is running for 6 hours..."
        for i in {1..360}; do
          sleep 60
          if [ $((i % 5)) -eq 0 ]; then
            echo "⏱️ Still alive... $(date)"
            if ! pgrep -f "./ZBProxy" > /dev/null; then
              echo "⚠️ ZBProxy died! Restarting..."
              screen -dmS zbproxy ./ZBProxy
            fi
            if ! pgrep -f "playit" > /dev/null; then
              echo "⚠️ playit.gg died! Restarting..."
              screen -dmS playit bash -c "playit"
            fi
          fi
        done
