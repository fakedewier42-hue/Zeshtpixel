name: Minecraft Server with Tailscale, GUI & playit.gg

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # =============================================
    # 1. نصب پیش‌نیازها و دسکتاپ گرافیکی
    # =============================================
    - name: Install dependencies & GUI
      run: |
        sudo apt-get update
        sudo apt-get install -y wget curl screen xfce4 xfce4-goodies xvfb x11vnc
        sudo apt-get install -y firefox

    # =============================================
    # 2. نصب و راه‌اندازی Tailscale
    # =============================================
    - name: Install Tailscale
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh

    - name: Connect to Tailscale
      env:
        TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        sudo tailscale up --authkey $TS_AUTHKEY --accept-routes --accept-dns

    # =============================================
    # 3. راه‌اندازی دسکتاپ گرافیکی (VNC)
    # =============================================
    - name: Setup VNC Server
      run: |
        # راه‌اندازی Xvfb (صفحه‌نمایش مجازی)
        Xvfb :99 -screen 0 1280x720x24 &
        export DISPLAY=:99
        
        # راه‌اندازی xfce4
        startxfce4 &
        sleep 5
        
        # راه‌اندازی VNC server
        x11vnc -display :99 -forever -nopw -passwd 123456 &

    # =============================================
    # 4. دانلود و اجرای ZBProxy
    # =============================================
    - name: Download ZBProxy
      run: |
        wget -q -O ZBProxy "https://github.com/layou233/ZBProxy/releases/download/v3.1.0/ZBProxy-linux-amd64-v1"
        chmod +x ZBProxy

    - name: Create ZBProxy Configuration
      run: |
        cat > ZBProxy.json << 'EOF'
        {
            "Log": {
                "Level": "info"
            },
            "Services": [
                {
                    "Name": "Hypixel-in",
                    "Listen": 25565,
                    "IPAccess": {
                        "Mode": ""
                    },
                    "Outbound": {}
                }
            ],
            "Router": {
                "DefaultOutbound": "RESET",
                "Rules": [
                    {
                        "Type": "always",
                        "Rewrite": {},
                        "Sniff": "minecraft"
                    },
                    {
                        "Type": "ServiceName",
                        "Parameter": "Hypixel-in",
                        "Rewrite": {
                            "Minecraft": {
                                "Hostname": "mc.hypixel.net",
                                "Port": 25565
                            }
                        },
                        "Outbound": "Hypixel-out"
                    }
                ]
            },
            "Outbounds": [
                {
                    "Name": "Hypixel-out",
                    "TargetAddress": "mc.hypixel.net",
                    "TargetPort": 25565,
                    "Minecraft": {
                        "OnlineCount": {
                            "Max": 20,
                            "Online": -1,
                            "EnableMaxLimit": false
                        },
                        "HostnameAccess": {
                            "Mode": ""
                        },
                        "NameAccess": {
                            "Mode": ""
                        },
                        "PingMode": "",
                        "MotdFavicon": "{DEFAULT_MOTD}",
                        "MotdDescription": "§6§lWelcome to §c§lZeshtPixel §e§lthe server by §b§lDabbler_"
                    },
                    "ProxyOptions": {}
                }
            ],
            "Lists": {}
        }
        EOF

    - name: Run ZBProxy in Screen
      run: |
        screen -dmS zbproxy ./ZBProxy
        sleep 5

    # =============================================
    # 5. نصب و راه‌اندازی playit.gg (با Claim Code)
    # =============================================
    - name: Install playit.gg
      run: |
        curl -fsSL https://packages.playit.gg/install.sh | bash -s -- -y

    - name: Run playit.gg and show Claim Code
      run: |
        echo "==========================================="
        echo "🔐 Starting playit.gg to get Claim Code..."
        echo "==========================================="
        
        # توقف سرویس systemd و حذف تنظیمات قبلی
        sudo systemctl stop playit.service || true
        sudo rm -rf /etc/playit || true
        rm -rf ~/.config/playit || true
        
        # اجرای playit در screen با زمان کافی برای نمایش Claim Code
        screen -dmS playit bash -c "playit"
        sleep 15
        
        # گرفتن خروجی از screen
        screen -S playit -X hardcopy /tmp/playit_output.txt
        
        echo "=== Full playit.gg output ==="
        cat /tmp/playit_output.txt
        echo "================================"
        
        # استخراج Claim Code
        CLAIM_URL=$(grep -o 'https://playit.gg/claim/[a-zA-Z0-9]*' /tmp/playit_output.txt | head -1)
        if [ -n "$CLAIM_URL" ]; then
          echo ""
          echo "🎯 Your Claim Code URL: $CLAIM_URL"
          echo "Open this link in your browser to claim your server!"
        else
          echo ""
          echo "⚠️ No Claim Code found. Check the full output above."
        fi
        echo "==========================================="

    # =============================================
    # 6. نمایش اطلاعات اتصال
    # =============================================
    - name: Show Connection Info
      run: |
        TAILSCALE_IP=$(sudo tailscale ip)
        echo "==========================================="
        echo "✅ Server is READY!"
        echo "==========================================="
        echo ""
        echo "🔗 Tailscale IP: $TAILSCALE_IP"
        echo "🌐 VNC Desktop: $TAILSCALE_IP:5900 (Password: 123456)"
        echo "🎮 Connect to Minecraft via playit.gg address"
        echo ""
        echo "📋 How to connect:"
        echo "   1. Find the Claim Code link above"
        echo "   2. Open it in your browser"
        echo "   3. Claim the device"
        echo "   4. Create a Minecraft Java tunnel on port 25565"
        echo "   5. Share the generated address with your friends"
        echo "==========================================="

    # =============================================
    # 7. نگهداشتن سرور (6 ساعت)
    # =============================================
    - name: Keep Alive
      run: |
        echo "🔄 Server is running for 6 hours..."
        for i in {1..360}; do
          sleep 60
          if [ $((i % 5)) -eq 0 ]; then
            echo "⏱️ Still alive... $(date)"
            # بررسی سلامت سرویس‌ها
            if ! pgrep -f "./ZBProxy" > /dev/null; then
              echo "⚠️ ZBProxy died! Restarting..."
              screen -dmS zbproxy ./ZBProxy
            fi
            if ! pgrep -f "playit" > /dev/null; then
              echo "⚠️ playit.gg died! Restarting..."
              screen -dmS playit bash -c "playit"
            fi
          fi
        done
